[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imake_humanoid_robot"
version = "2025.09.07"
description = "Training environment for iMake Humanoid Robot"
authors = [
    { name = "iMake Humanoid Robot Project Developers" },
    { name = "-T.K.-" },
]
maintainers = [
    { name = "iMake Humanoid Robot Project Developers" },
    { name = "-T.K.-" },
]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["robotics", "isaaclab"]
classifiers = [
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
    "Isaac Sim :: 5.1.0",
]
dependencies = [
    "psutil",
]

[project.urls]
repository = "https://github.com/imakeinnovation/iMake-Humanoid-Robot"

[tool.setuptools]
packages = ["imake_humanoid_robot"]
zip-safe = false 
